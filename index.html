<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Poppins", sans-serif;
}
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#020617,#0f4c81,#38bdf8);
    overflow:hidden;
}

.card{
    width:700px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.3);
    border-radius:25px;
    padding:40px;
    text-align:center;
    color:#ffffff;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
}

h1{
    font-size:42px;
    margin-bottom:10px;
}

h2{
    color:#7dd3fc;
    margin-bottom:25px;
}

p{
    font-size:18px;
    line-height:1.8;
}

.tech{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin-top:30px;
}

.tech span{
    background:#ffffff;
    color:#075985;
    padding:12px 20px;
    border-radius:30px;
    font-weight:bold;
    transition:.3s;
}

.tech span:hover{
    transform:translateY(-5px);
    background:#38bdf8;
    color:#ffffff;
}

.footer{
    margin-top:35px;
    font-size:15px;
    color:#e0f2fe;
    opacity:.9;
}

.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(125,211,252,.25);
    animation:float 8s infinite ease-in-out;
}

.circle:nth-child(1){
    width:180px;
    height:180px;
    top:-60px;
    left:-60px;
}

.circle:nth-child(2){
    width:120px;
    height:120px;
    bottom:40px;
    right:50px;
    animation-delay:2s;
}

.circle:nth-child(3){
    width:90px;
    height:90px;
    bottom:120px;
    left:100px;
    animation-delay:4s;
}

@keyframes float{
    50%{
        transform:translateY(-20px);
    }
}
</style>
</head>

<body>

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<div class="card">

<h1> CI/CD Pipeline </h1>

<h2>Successfully Deployed!</h2>

<p>
This webpage was automatically deployed using
a complete DevOps CI/CD pipeline.
</p>

<div class="tech">
<span>☁ AWS EC2</span>
<span>⚙ Jenkins</span>
<span>🐳 Docker</span>
<span>🐙 GitHub</span>
</div>

<div class="footer">
✨ Built & Deployed Automatically ✨
</div>

</div>

</body>
</html>
